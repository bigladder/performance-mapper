[project]
name = "performance-mapper-examples"
version = "0.0.0"
description = "Runnable examples for performance-mapper: a synthetic water-cooled chiller dataset and the scripts that map it."
requires-python = ">=3.10"
dependencies = [
    "performance-mapper",
    "numpy>=1.24",
    "scipy>=1.15.3",
    "dash>=2.14",
    "plotly>=5.18",
]

# A workspace member, sharing the repository's single virtual environment. Its heavy
# plotting dependencies (dash, plotly) stay out of the core package's dependency tree;
# they are installed only when this member is synced.
[tool.uv.sources]
performance-mapper = { workspace = true }

# Not an installable package -- just a home for scripts and their dependencies.
[tool.uv]
package = false
