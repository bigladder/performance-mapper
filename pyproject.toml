[project]
name = "performance_mapper"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "doit",
    "pre-commit",
    "mypy",
    "twine>=6.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "PL",
    "I001",
]
ignore = [
    "F405",
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
]

[tool.mypy]
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "performance_mapper.*"
disable_error_code = [
    "annotation-unchecked",
    "import",
]

[tool.hatch.build.targets.wheel]
packages = [
    "performance_mapper",
]

[tool.hatch.build.targets.wheel.force-include]

[tool.uv.sources]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
